<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 640" role="img" aria-labelledby="arch-title"><title id="arch-title">Local Laya POC architecture: Flutter, authenticated Serverpod, PostgreSQL, mock feedback, workspace memory, and local Laya inference</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><style>.name{font:600 17px system-ui;fill:#17243b}.small{font:13px system-ui;fill:#526178}.label{font:12px system-ui;fill:#526178}.edge{stroke:#64748b;stroke-width:1.6;fill:none;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style><rect x="300" y="15" width="590" height="600" rx="18" fill="#f1f5fb" stroke="#d2deef" stroke-dasharray="6 5"/><text x="325" y="48" class="small">SERVERPOD BACKEND PROCESS</text><rect x="30" y="70" width="210" height="100" rx="12" fill="white" stroke="#ccd6e5"/><text x="48" y="103" class="name">PostgreSQL</text><text x="48" y="130" class="small">Membership + run limits</text><text x="48" y="153" class="small">Existing managed database</text><rect x="640" y="70" width="220" height="100" rx="12" fill="white" stroke="#ccd6e5"/><text x="658" y="103" class="name">Mock sources</text><text x="658" y="130" class="small">34 reports / five channels</text><text x="658" y="153" class="small">Generated inside backend</text><rect x="30" y="260" width="210" height="110" rx="12" fill="white" stroke="#ccd6e5"/><text x="48" y="293" class="name">Flutter web</text><text x="48" y="320" class="small">Cards, groups, evidence</text><text x="48" y="343" class="small">Filters + review queue</text><rect x="325" y="260" width="220" height="110" rx="12" fill="white" stroke="#ccd6e5"/><text x="343" y="293" class="name">LayaPocEndpoint</text><text x="343" y="320" class="small">Login + workspace access</text><text x="343" y="343" class="small">Admin / Editor can write</text><rect x="640" y="260" width="220" height="110" rx="12" fill="white" stroke="#ccd6e5"/><text x="658" y="293" class="name">POC engine + adapter</text><text x="658" y="320" class="small">Retrieve / compare / group</text><text x="658" y="343" class="small">PocRun + LayaClient</text><rect x="1005" y="260" width="225" height="110" rx="12" fill="white" stroke="#ccd6e5"/><text x="1023" y="293" class="name">Local Laya 0.4.1</text><text x="1023" y="320" class="small">English model / Apple MPS</text><text x="1023" y="343" class="small">127.0.0.1:8093 / no API key</text><rect x="640" y="505" width="220" height="85" rx="12" fill="white" stroke="#ccd6e5"/><text x="658" y="538" class="name">Workspace scratch state</text><text x="658" y="565" class="small">Groups, decisions, statuses</text><path class="edge both" d="M240 315H325"/><path class="edge both" d="M545 315H640"/><path class="edge both" d="M860 315H1005"/><path class="edge both" d="M325 280H275V120H240"/><path class="edge " d="M750 170V260"/><path class="edge both" d="M750 370V505"/><text x="282" y="299" text-anchor="middle" class="label">RPC / JSON</text><text x="592" y="299" text-anchor="middle" class="label">step / snapshot</text><text x="932" y="299" text-anchor="middle" class="label">HTTP / batch</text><text x="218" y="207" text-anchor="middle" class="label">access + limits</text><text x="805" y="220" text-anchor="middle" class="label">sample text</text><text x="810" y="445" text-anchor="middle" class="label">workspace key</text><text x="30" y="446" class="small">Viewer: read only</text><text x="30" y="470" class="small">Source cards are mock integrations</text><text x="325" y="563" class="small">Results clear on restart</text><text x="325" y="586" class="small">Live tickets unchanged</text><text x="1005" y="446" class="small">Inference stays local</text><text x="1005" y="470" class="small">No OpenRouter or Docker needed</text></svg>