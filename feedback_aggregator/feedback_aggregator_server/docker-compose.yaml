services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: feedback_aggregator
      POSTGRES_PASSWORD: "pzjoL879quXmZu6ygdJSmGQLCzGNKrW0"
    volumes:
      - feedback_aggregator_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "A2WVuqOrosbuDu9eLcRAPaMATEKWrjB8"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: feedback_aggregator_test
      POSTGRES_PASSWORD: "dnbawfgzaqBZit9aZ4ffk1WzLwuopoHM"
    volumes:
      - feedback_aggregator_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "IG2YQW8vcfn67JgDFwYTX-9wuZdRZijt"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  feedback_aggregator_data:
  feedback_aggregator_test_data:
