# Local credentials come from the ignored .env file; see ../COLLABORATOR_SETUP.md.
services:
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: feedback_aggregator
      POSTGRES_PASSWORD: ${SERVERPOD_PASSWORD_database:?Set SERVERPOD_PASSWORD_database in .env}
    volumes:
      - feedback_aggregator_data:/var/lib/postgresql/data
  redis:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:8091:6379"
    command:
      - redis-server
      - --requirepass
      - ${SERVERPOD_PASSWORD_redis:?Set SERVERPOD_PASSWORD_redis in .env}
    environment:
      - REDIS_REPLICATION_MODE=master
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "127.0.0.1:9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: feedback_aggregator_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Set POSTGRES_TEST_PASSWORD in .env}
    volumes:
      - feedback_aggregator_test_data:/var/lib/postgresql/data
  redis_test:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:9091:6379"
    command:
      - redis-server
      - --requirepass
      - ${REDIS_TEST_PASSWORD:?Set REDIS_TEST_PASSWORD in .env}
    environment:
      - REDIS_REPLICATION_MODE=master
volumes:
  feedback_aggregator_data:
  feedback_aggregator_test_data:
